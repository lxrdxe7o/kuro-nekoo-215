<svg width="100%" height="100%" viewBox="0 0 800 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .bg { fill: #0d1117; }
      
      .text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        fill: #8b949e;
      }
      
      .highlight {
        fill: #e3b341;
        font-weight: bold;
      }
      
      .heart-container {
        transform-box: fill-box;
        transform-origin: center;
        animation: heartbeat 1.5s ease-in-out infinite;
      }
      
      .heart {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        fill: #ff0080;
        text-anchor: middle;
      }
      
      @keyframes heartbeat {
        0% { transform: scale(1); }
        14% { transform: scale(1.3); }
        28% { transform: scale(1); }
        42% { transform: scale(1.3); }
        70% { transform: scale(1); }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <!-- Centering strategy: Manual positioning for simplicity -->
  <!-- "made with " ~ 90px -->
  <!-- "💖" ~ 20px -->
  <!-- " by xero..." ~ 240px -->
  <!-- Total ~ 350px. Start x ~ 225 -->
  
  <g transform="translate(330, 55)" text-anchor="middle">
    <!-- Left part -->
    <text x="-20" y="0" class="text" text-anchor="end">made with</text>
    
    <!-- Heart optimized for animation -->
    <g class="heart-container">
       <text x="0" y="0" class="heart" alignment-baseline="middle">💖</text>
    </g>
    
    <!-- Right part -->
    <text x="20" y="0" class="text" text-anchor="start">by <tspan class="highlight">xero</tspan> (github: lxrdxe7o)</text>
  </g>
</svg>
